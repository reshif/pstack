name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@v10.1.0

      # pyyaml turns on the strict frontmatter parse in `make verify`; without it the step is skipped.
      - name: Install pyyaml
        run: python3 -m pip install pyyaml

      # Manifest, per-host build, and verify: links, contracts, run-record cases, YAML.
      - name: make all
        run: make all

      # Packages the builds into the CLI and runs its test suite. Failing tests are also posted as
      # annotations, which show on the run page and in the public checks API.
      - name: make test-cli
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/test-cli.log"
          make test-cli 2>&1 | tee "$log" || {
            if grep -qE '^(FAILED|ERROR) ' "$log"; then
              grep -E '^(FAILED|ERROR) ' "$log" | head -20 | while read -r line; do echo "::error title=test-cli::$line"; done
            else
              tail -n 8 "$log" | while read -r line; do echo "::error title=test-cli (no test summary)::$line"; done
            fi
            exit 1
          }

      # The eval harness's own tests. Calls no model.
      - name: make evals-test
        run: make evals-test

      # dist/ is generated and ignored; a build must leave no tracked file changed.
      - name: Tree unchanged by the build
        run: git diff --exit-code
